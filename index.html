<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fidermax: Evolution</title>
    <style>
        <link rel="manifest" href="manifest.json">
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 800px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border: 2px solid #1f293d;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
        }
        .ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            z-Index: 5;
        }
        .stat-group {
            display: flex;
            gap: 15px;
        }
        .highlight {
            color: #00f3ff;
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }
        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #00f3ff, #b537f2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }
        p {
            color: #9ca3af;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
            max-width: 400px;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            color: #fff;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .controls-hint {
            margin-top: 25px;
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        
        <div class="ui-panel">
            <div class="stat-group">
                <div>PTS: <span id="score-val" class="highlight">0</span></div>
                <div>NIVEL: <span id="level-val" class="highlight">1</span></div>
            </div>
            <div><span id="lives-val" class="highlight">❤️❤️❤️</span></div>
        </div>

        <div id="menu-screen">
            <h1>Fidermax</h1>
            <p>Destruye enemigos, recolecta núcleos de energía para evolucionar tu armamento masivo y sobrevive a la horda.</p>
            <button class="btn" onclick="startGame()">INICIAR MISIÓN</button>
            <div class="controls-hint">💡 <b>Control táctil:</b> Desliza tu dedo por la pantalla para mover la nave.<br>El disparo es totalmente automático.</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score-val");
    const levelEl = document.getElementById("level-val");
    const livesEl = document.getElementById("lives-val");
    const menuScreen = document.getElementById("menu-screen");

    let gameRunning = false;
    let score = 0;
    let lives = 3;
    let weaponLevel = 1;
    let xp = 0;
    let nextLevelXp = 5;

    // Control táctil y de teclado unificado
    let targetX = canvas.width / 2;

    window.addEventListener("touchmove", (e) => {
        if (!gameRunning) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = e.touches[0].clientX - rect.left;
        // Escalar la posición táctil al tamaño interno del canvas
        targetX = (touchX / rect.width) * canvas.width;
    }, { passive: false });

    window.addEventListener("touchstart", (e) => {
        if (!gameRunning) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = e.touches[0].clientX - rect.left;
        targetX = (touchX / rect.width) * canvas.width;
    }, { passive: false });

    // Soporte opcional de teclado por si se juega en PC
    const keys = { left: false, right: false };
    window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    });
    window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    });

    let player;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerUps = [];
    let enemySpawnTimer = 0;

    class Player {
        constructor() {
            this.width = 38;
            this.height = 38;
            this.x = canvas.width / 2 - this.width / 2;
            this.y = canvas.height - 80;
            this.shootCooldown = 0;
        }

        update() {
            // Movimiento fluido hacia la posición del dedo o controles de PC
            if (keys.left) {
                this.x -= 6;
                targetX = this.x;
            } else if (keys.right) {
                this.x += 6;
                targetX = this.x;
            } else {
                // Perseguir suavemente la posición táctil del dedo
                let dx = targetX - (this.x + this.width / 2);
                this.x += dx * 0.2;
            }

            // Limitar dentro de la pantalla
            if (this.x < 0) this.x = 0;
            if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;

            // Disparo automático
            if (this.shootCooldown > 0) {
                this.shootCooldown--;
            } else {
                this.shoot();
                this.shootCooldown = Math.max(8, 22 - (weaponLevel * 2));
            }
        }

        shoot() {
            const cx = this.x + this.width / 2;
            const cy = this.y;

            if (weaponLevel === 1) {
                bullets.push(new Bullet(cx - 2, cy, 0, -10, '#00f3ff'));
            } else if (weaponLevel === 2) {
                bullets.push(new Bullet(cx - 8, cy, 0, -10, '#00f3ff'));
                bullets.push(new Bullet(cx + 6, cy, 0, -10, '#00f3ff'));
            } else if (weaponLevel === 3) {
                bullets.push(new Bullet(cx - 2, cy, 0, -11, '#b537f2'));
                bullets.push(new Bullet(cx - 8, cy, -1.5, -10, '#b537f2'));
                bullets.push(new Bullet(cx + 6, cy, 1.5, -10, '#b537f2'));
            } else {
                bullets.push(new Bullet(cx - 2, cy, 0, -13, '#00ff66'));
                bullets.push(new Bullet(cx - 10, cy, -1, -11, '#00ff66'));
                bullets.push(new Bullet(cx + 8, cy, 1, -11, '#00ff66'));
                bullets.push(new Bullet(cx - 16, cy, -2.5, -9, '#00f3ff'));
                bullets.push(new Bullet(cx + 14, cy, 2.5, -9, '#00f3ff'));
            }
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#00f3ff';
            
            ctx.beginPath();
            ctx.moveTo(this.x + this.width / 2, this.y);
            ctx.lineTo(this.x + this.width, this.y + this.height);
            ctx.lineTo(this.x + this.width / 2, this.y + this.height - 10);
            ctx.lineTo(this.x, this.y + this.height);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    class Bullet {
        constructor(x, y, vx, vy, color) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.width = 4;
            this.height = 12;
            this.color = color;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.restore();
        }
    }

    class Enemy {
        constructor() {
            this.width = 32;
            this.height = 32;
            this.x = Math.random() * (canvas.width - this.width);
            this.y = -40;
            this.speed = 1.5 + Math.random() * 1.5 + (weaponLevel * 0.2);
            this.health = Math.ceil(weaponLevel / 2) + (Math.random() > 0.8 ? 2 : 0);
            this.maxHealth = this.health;
            this.color = this.maxHealth > 2 ? '#ff3366' : '#ff9900';
        }

        update() {
            this.y += this.speed;
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            
            if (this.maxHealth > 1) {
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x, this.y - 6, this.width, 4);
                ctx.fillStyle = '#00ff66';
                ctx.fillRect(this.x, this.y - 6, (this.width * (this.health / this.maxHealth)), 4);
            }
            ctx.restore();
        }
    }

    class PowerUp {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 18;
            this.height = 18;
            this.speed = 2;
        }

        update() {
            this.y += this.speed;
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00ff66';
            ctx.fillStyle = '#00ff66';
            ctx.beginPath();
            ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 0.5) * 5;
            this.alpha = 1;
            this.color = color;
            this.size = Math.random() * 3 + 1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.03;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.restore();
        }
    }

    function startGame() {
        score = 0;
        lives = 3;
        weaponLevel = 1;
        xp = 0;
        nextLevelXp = 5;
        bullets = [];
        enemies = [];
        particles = [];
        powerUps = [];
        player = new Player();
        targetX = canvas.width / 2;
        
        updateUI();
        menuScreen.style.display = "none";
        gameRunning = true;
        loop();
    }

    function gameOver() {
        gameRunning = false;
        menuScreen.style.display = "flex";
        menuScreen.querySelector("h1").innerText = "Misión Fallida";
        menuScreen.querySelector("p").innerText = `Puntaje Final: ${score} | Nivel de Arma Alcanzado: ${weaponLevel}`;
        menuScreen.querySelector(".btn").innerText = "REINTENTAR";
    }

    function addXP(amount) {
        xp += amount;
        if (xp >= nextLevelXp) {
            xp = 0;
            weaponLevel++;
            nextLevelXp += 5;
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(player.x + player.width/2, player.y + player.height/2, '#00f3ff'));
            }
        }
        updateUI();
    }

    function updateUI() {
        scoreEl.innerText = score;
        levelEl.innerText = weaponLevel;
        let hearts = "";
        for (let i = 0; i < lives; i++) hearts += "❤️ ";
        livesEl.innerText = hearts;
    }

    function checkCollisions() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                
                if (b.x < e.x + e.width && b.x + b.width > e.x &&
                    b.y < e.y + e.height && b.y + b.height > e.y) {
                    
                    e.health--;
                    bullets.splice(i, 1);

                    if (e.health <= 0) {
                        score += 10 * weaponLevel;
                        addXP(1);

                        if (Math.random() < 0.35) {
                            powerUps.push(new PowerUp(e.x + e.width / 2, e.y + e.height / 2));
                        }

                        for (let p = 0; p < 12; p++) {
                            particles.push(new Particle(e.x + e.width/2, e.y + e.height/2, e.color));
                        }
                        
                        enemies.splice(j, 1);
                    }
                    break;
                }
            }
        }

        for (let i = powerUps.length - 1; i >= 0; i--) {
            let p = powerUps[i];
            if (p.x < player.x + player.width && p.x + p.width > player.x &&
                p.y < player.y + player.height && p.y + p.height > player.y) {
                addXP(2);
                powerUps.splice(i, 1);
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.x < player.x + player.width && e.x + e.width > player.x &&
                e.y < player.y + player.height && e.y + e.height > player.y) {
                
                lives--;
                updateUI();
                
                for (let p = 0; p < 15; p++) {
                    particles.push(new Particle(player.x + player.width/2, player.y + player.height/2, '#ff3366'));
                }

                enemies.splice(i, 1);

                if (lives <= 0) {
                    gameOver();
                }
            }
        }
    }

    function loop() {
        if (!gameRunning) return;

        ctx.fillStyle = "rgba(3, 7, 18, 0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        enemySpawnTimer++;
        if (enemySpawnTimer > Math.max(20, 60 - (weaponLevel * 8))) {
            enemies.push(new Enemy());
            enemySpawnTimer = 0;
        }

        player.update();
        player.draw();

        bullets.forEach((b, index) => {
            b.update();
            b.draw();
            if (b.y < -20) bullets.splice(index, 1);
        });

        enemies.forEach((e, index) => {
            e.update();
            e.draw();
            if (e.y > canvas.height + 50) enemies.splice(index, 1);
        });

        powerUps.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.y > canvas.height + 20) powerUps.splice(index, 1);
        });

        particles.forEach((pt, index) => {
            pt.update();
            pt.draw();
            if (pt.alpha <= 0) particles.splice(index, 1);
        });

        checkCollisions();

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
